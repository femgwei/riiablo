// Architecture ratchet: fail when a mechanism package gains a new dependency
// on client/presentation code. Existing bridges are listed in the test as
// migration debt and must shrink over time.
task architectureRegression(type: Test) {
  group = 'verification'
  description = 'Checks Java dependency direction and prevents new reverse-layer imports.'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  filter { includeTestsMatching 'com.riiablo.architecture.*' }
  maxHeapSize = test.maxHeapSize
  systemProperty 'java.awt.headless', 'true'
  systemProperty 'gdx.test.headless', 'true'
  testLogging { events 'failed'; exceptionFormat 'full' }
}

// Map-only regression gate for the Act II–V layout work.  Keep this separate
// from the full core test task so a second machine can verify map topology,
// Warp links, native RoomEx projection, DT1 export, and preset-unit queues
// without running the unrelated combat/UI suites.
task mapRegression(type: Test) {
  group = 'verification'
  description = 'Runs the automated Act II–V map and D2MOO bridge regression tests.'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  filter {
    // Keep the gate focused on map generation/topology.  Generic physics and
    // object-collision tests live in the normal :core:test task and are not
    // part of the Act II–V map completion gate.
    includeTestsMatching 'com.riiablo.map.Act2*'
    includeTestsMatching 'com.riiablo.map.Act1NativeOrthAnchorTest'
    includeTestsMatching 'com.d2moo.common.drlg.DrlgMazeMergeTest'
    includeTestsMatching 'com.d2moo.common.drlg.DrlgLinkedFloorTest'
    includeTestsMatching 'com.riiablo.map.NativeDoorIdsTest'
    includeTestsMatching 'com.riiablo.engine.server.RoomEntityTrackingSystemTest'
    includeTestsMatching 'com.riiablo.engine.server.DynamicUnitCollisionSystemTest'
    includeTestsMatching 'com.riiablo.engine.server.object.NativeObjectOperateTableTest'
    includeTestsMatching 'com.riiablo.map.Act3*'
    includeTestsMatching 'com.riiablo.map.Act4*'
    includeTestsMatching 'com.riiablo.map.Act5*'
    includeTestsMatching 'com.riiablo.map.NativeLevelSeedTest'
    includeTestsMatching 'com.riiablo.map.NativeWaypointResourceTest'
    includeTestsMatching 'com.riiablo.map.ActTownSeamResourceTest'
    includeTestsMatching 'com.riiablo.map.NativeSeamCollisionTest'
    includeTestsMatching 'com.riiablo.map.PlayerGroundPathTest'
    includeTestsMatching 'com.riiablo.map.MapTourPlanTest'
    includeTestsMatching 'com.riiablo.map.NativeExpansionIdsTest'
    includeTestsMatching 'com.riiablo.map.RoomExAdjacencyTest'
    includeTestsMatching 'com.riiablo.map.ZoneCoordinateAlignmentTest'
    includeTestsMatching 'com.riiablo.map.CaveEntranceDs1VisibilityTest'
    includeTestsMatching 'com.riiablo.map.AutomapRoomProjectionIntegrationTest'
    includeTestsMatching 'com.riiablo.engine.client.automap.NativeWallTileTypeTest'
    includeTestsMatching 'com.riiablo.map.d2moo.*'
    excludeTestsMatching 'com.riiablo.map.d2moo.Act1*'
    includeTestsMatching 'com.riiablo.engine.server.npc.Act2Act3TownNpcRegistrationTest'
  }
  maxHeapSize = test.maxHeapSize
  systemProperty 'java.awt.headless', 'true'
  systemProperty 'gdx.test.headless', 'true'
}

