// Repeatable monster behavior gate: decisions plus observable ECS effects.
// Separate Gradle filters let day-to-day edits avoid the entire AI regression suite.
// The original monsterBehaviorTest remains the broad, backwards-compatible gate.
def monsterScenarioSuite = 'com.riiablo.engine.server.ai.MonsterBehaviorScenarioIntegrationTest'
def monsterTestGroups = [
    monsterDataTest: [
        'com.riiablo.engine.server.MonsterStatsCalculatorNativeTest',
        'com.riiablo.engine.server.MonsterAttackProfileIntegrationTest',
        'com.riiablo.engine.server.MonsterMeleeDataReferenceTest'],
    monsterCombatTest: [
        'com.riiablo.engine.server.combat.CombatSystemTest',
        'com.riiablo.engine.server.combat.CombatEcsEventScenarioTest',
        'com.riiablo.engine.server.MonsterMeleeSettlementTest'],
    monsterAttackTest: [
        monsterScenarioSuite + '.monsterMeleeNativeMitigationReachesActualPlayerLife',
        monsterScenarioSuite + '.monsterMeleeFixedPointSurvivesLifeEventsAndVitalsSync',
        monsterScenarioSuite + '.nativeAnimationMustDeliverTheAiAttack',
        monsterScenarioSuite + '.meleeAiMustActuallyHurtPlayer',
        monsterScenarioSuite + '.targetEscapingBeforeAttackMarkerTakesNoMeleeDamage',
        'com.riiablo.engine.server.FallenShamanAutoCombatIntegrationTest'],
    monsterPursuitTest: [
        monsterScenarioSuite + '.pursuingAiMustMakeProgressAndFollowMovingTarget',
        'com.riiablo.engine.server.PathfinderRecoveryTargetTest.continuouslyMovingTargetDoesNotStarvePursuitVelocity'],
    monsterSummonTest: [
        monsterScenarioSuite + '.spawningAiCreatesConfiguredLivingChildren',
        monsterScenarioSuite + '.exhaustedNestCannotProduceUnlimitedChildren',
        monsterScenarioSuite + '.blockedNestPlacementCannotCreateAChild',
        monsterScenarioSuite + '.generatorsWithoutAnEnemyDoNotSpawn'],
    monsterMissileTest: [
        'com.riiablo.engine.server.MonsterMissileSourceIntegrationTest',
        'com.riiablo.engine.server.MonsterMissilePhysicalIntegrationTest',
        'com.riiablo.engine.server.MonsterMissileElementalIntegrationTest',
        'com.riiablo.engine.server.MonsterMissilePoisonIntegrationTest',
        'com.riiablo.engine.server.combat.MonsterPoisonSnapshotTest',
        'com.riiablo.engine.server.QuillRatMissileTest',
        'com.riiablo.engine.server.MissileNativePolicyTest',
        'com.riiablo.engine.server.MissileRoomTrackingTest',
        'com.riiablo.engine.server.SpecialMissileLifecycleTest'],
    monsterElementalTest: [
        'com.riiablo.engine.server.MonsterMissileSourceIntegrationTest',
        'com.riiablo.engine.server.MonsterMissileElementalIntegrationTest',
        'com.riiablo.engine.server.ShamanFireballAuditTest'],
    monsterPoisonTest: [
        'com.riiablo.engine.server.MonsterMissileSourceIntegrationTest',
        'com.riiablo.engine.server.PoisonRegenIntegrationTest',
        'com.riiablo.engine.server.PotionRecoverySystemTest',
        'com.riiablo.engine.server.MonsterMissilePoisonIntegrationTest',
        'com.riiablo.engine.server.combat.MonsterPoisonSnapshotTest',
        'com.riiablo.engine.server.combat.StatusEffectApplierTest',
        'com.riiablo.engine.server.StatusEffectEcsScenarioTest',
        'com.riiablo.engine.server.AmazonSkillSpecializationTest.poisonJavelinCreatesPersistentPoisonCloud',
        'com.riiablo.engine.server.AmazonSkillSpecializationTest.corpsePoisonCloudUsesSharedPersistentAreaLifecycle',
        'com.riiablo.engine.server.AmazonSkillSpecializationTest.plagueJavelinHitFansOutNativePoisonCloudRing',
        'com.riiablo.engine.server.AssassinSkillSpecializationTest.venomAddsDamageAndOverridesItemPoisonLength',
        'com.riiablo.engine.server.DruidRabiesFireClawsTest',
        'com.riiablo.engine.server.NecromancerPoisonDaggerIntegrationTest',
        'com.riiablo.engine.server.NecromancerPoisonNovaIntegrationTest',
        'com.riiablo.engine.server.NecromancerExplosionIntegrationTest.poisonExplosionCreatesEightAuthoritativeDriftingCloudsAndAppliesFixedPoison'],
    monsterSpecialTest: [
        monsterScenarioSuite + '.suicideAiDamagesNearbyPlayerOnlyAfterNativeFourFrameDelay',
        monsterScenarioSuite + '.shamanRangedAiMissileMustReachAndDamagePlayer',
        monsterScenarioSuite + '.succubusCurseMustInstallStateOnPlayer',
        'com.riiablo.engine.server.RemainingMonsterSkillIntegrationTest',
        'com.riiablo.engine.server.NativeExplosionLifecycleTest',
        'com.riiablo.engine.server.NativeMonsterChargeTest'],
    monsterAiTest: ['com.riiablo.engine.server.ai.*']
