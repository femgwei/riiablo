dependencies {
  testImplementation platform('org.junit:junit-bom:5.7.1')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.mockito:mockito-junit-jupiter:5.4.0'
  testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
  testImplementation("com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion") {
    // The LWJGL2 test backend and LWJGL3 cannot share the same test JVM:
    // both publish org.lwjgl classes with incompatible binary APIs.  The
    // opt-in window smoke test uses LWJGL3; legacy visual tests remain
    // available in their dedicated backend modules.
    exclude group: 'org.lwjgl.lwjgl'
  }
  testImplementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  testImplementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
}

test {
  // Native golden tests must be reproducible against the selected installation,
  // not whichever version happens to be registered on the developer machine.
  def selectedD2Home = project.findProperty('d2Home') ?: System.getenv('D2_HOME') ?: ''
  inputs.property 'd2Home', selectedD2Home
  if (selectedD2Home) environment 'D2_HOME', selectedD2Home
  useJUnitPlatform {
    // A few legacy decoder tests are interactive resource previews backed by
    // LWJGL. They render until a developer closes the window and therefore
    // are not part of unattended CI. Opt in explicitly with -PvisualTests.
    if (!project.hasProperty('visualTests')) excludeTags 'visual'
  }
  // AssetManagerTest initializes a pool of full DCC pixel buffers. Gradle's
  // default 512 MiB test-worker heap can fail before the assertions run, so
  // give the isolated test JVM enough room without increasing game runtime
  // memory or the Gradle daemon heap.
  maxHeapSize = '2g'
  // Combat scenario tests exercise ECS/calculation code only. Keep the test
  // JVM explicitly headless so a developer machine never opens a LibGDX
  // window while running the automated combat suite.
  systemProperty 'java.awt.headless', 'true'
  systemProperty 'gdx.test.headless', 'true'
  testLogging {
    events "failed"//, "passed", "skipped"
    exceptionFormat "full"
    // Use -PcombatLogs when a scripted run needs its structured scenario
    // output in the console and Gradle test report. The default remains quiet
    // except for failures.
    if (project.hasProperty('combatLogs')) {
      showStandardStreams = true
      events "passed", "failed", "skipped", "standard_out", "standard_error"
    }
  }
}

// One gate for session isolation, loading/navigation, resources and representative server behavior.
task subsystemRegression(type: Test) {
  group = 'verification'
  description = 'Tests subsystem ownership and lifecycle boundaries without starting game clients.'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  filter {
    includeTestsMatching 'com.riiablo.architecture.*'
    includeTestsMatching 'com.riiablo.screen.*'
    includeTestsMatching 'com.riiablo.engine.client.ClientGameplayContextTest'
    includeTestsMatching 'com.riiablo.engine.client.ClientNetworkSessionTest'
    includeTestsMatching 'com.riiablo.engine.client.ClientAudioSession*'
    includeTestsMatching 'com.riiablo.engine.server.ServerGameplayContextTest'
    includeTestsMatching 'com.riiablo.engine.server.ServerSystemIsolationTest'
    includeTestsMatching 'com.riiablo.engine.server.AuthoritativeSimulationTest'
    includeTestsMatching 'com.riiablo.engine.SimulationSession*Test'
    includeTestsMatching 'com.riiablo.map.MapAssetLifecycleTest'
    includeTestsMatching 'com.riiablo.map.MapBuilderIsolationTest'
    includeTestsMatching 'com.riiablo.map.Act1MapBuilderD2MooLayersTest'
    includeTestsMatching 'com.riiablo.map.d2moo.Act1D2MOOLayoutBridgeTest'
    includeTestsMatching 'com.riiablo.map.MapManager*'
    includeTestsMatching 'com.riiablo.map.Box2DPhysicsTest'
    includeTestsMatching 'com.riiablo.engine.server.ObjectInitializer*'
    includeTestsMatching 'com.riiablo.engine.server.ServerEntityFactory*'
    includeTestsMatching 'com.riiablo.engine.server.ActioneerTest'
    includeTestsMatching 'com.riiablo.engine.server.BestowIntegrationTest'
    includeTestsMatching 'com.riiablo.engine.server.ShamanFireballAuditTest'
    includeTestsMatching 'com.riiablo.engine.server.AmazonDamageOwnershipTest'
    includeTestsMatching 'com.riiablo.engine.server.AmazonMeleeSkillLifecycleTest'
    includeTestsMatching 'com.riiablo.engine.server.BarbarianWhirlwindTest'
    includeTestsMatching 'com.riiablo.engine.server.NecromancerSummonIntegrationTest'
    includeTestsMatching 'com.riiablo.engine.server.NecromancerCurseIntegrationTest'
    includeTestsMatching 'com.riiablo.engine.server.NecromancerBoneWallIntegrationTest'
    includeTestsMatching 'com.riiablo.engine.server.NecromancerPoisonNovaIntegrationTest'
