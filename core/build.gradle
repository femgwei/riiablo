monsterTestGroups.each { suiteName, patterns ->
  tasks.register(suiteName, Test) {
    group = 'verification'
    description = "Focused monster regressions: ${suiteName}; see docs/monster-combat-parity.md."
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { excludeTags 'visual' }
    filter { patterns.each { includeTestsMatching it } }
    if (suiteName == 'monsterAiTest') {
      filter { excludeTestsMatching monsterScenarioSuite }
    }
    def selectedD2Home = project.findProperty('d2Home') ?: System.getenv('D2_HOME') ?: ''
    inputs.property 'd2Home', selectedD2Home
    if (selectedD2Home) environment 'D2_HOME', selectedD2Home
    maxHeapSize = test.maxHeapSize
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'gdx.test.headless', 'true'
    testLogging { events 'failed'; exceptionFormat 'full' }
  }
}

