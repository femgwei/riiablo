apply plugin: 'java'
apply plugin: 'application'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]

// JavaExec tasks use the packaged :core runtime artifact.  FlatBuffers
// classes are generated during :core:createFlatBuffers; without an explicit
// dependency Gradle can reuse an older core JAR and the headless server then
// fails at runtime with NoClassDefFoundError for newly added network tables.
tasks.withType(JavaExec).configureEach {
  dependsOn ':core:jar'
}

application {
  mainClass = 'com.riiablo.server.d2gs.D2GS'
}

run {
  workingDir = rootProject.file('assets').path
  setStandardInput(System.in)
  setIgnoreExitValue(true)
}

tasks.register('headlessCombat', JavaExec) {
  group = 'verification'
  description = 'Runs a windowless D2GS plus one real protocol client combat smoke test.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.riiablo.server.d2gs.D2GSHeadlessClient'
  workingDir = rootProject.file('assets').path

  def d2Home = providers.environmentVariable('D2_HOME')
  if (d2Home.isPresent()) {
    args '--home', d2Home.get()
  }
  if (project.hasProperty('d2Save')) {
    args '--save', project.property('d2Save')
  }
  if (project.hasProperty('combatSkill')) {
    args '--skill', project.property('combatSkill')
  }
}

