apply plugin: 'java'
apply plugin: 'application'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]

application {
  mainClass = 'com.riiablo.server.d2gs.D2GS'
}

run {
  workingDir = rootProject.file('assets').path
  setStandardInput(System.in)
  setIgnoreExitValue(true)
}

tasks.register('headlessCombat', JavaExec) {
  group = 'verification'
  description = 'Runs a windowless D2GS plus one real protocol client combat smoke test.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.riiablo.server.d2gs.D2GSHeadlessClient'
  workingDir = rootProject.file('assets').path

  def d2Home = providers.environmentVariable('D2_HOME')
  if (d2Home.isPresent()) {
    args '--home', d2Home.get()
  }
  if (project.hasProperty('d2Save')) {
    args '--save', project.property('d2Save')
  }
  if (project.hasProperty('combatSkill')) {
    args '--skill', project.property('combatSkill')
  }
}

tasks.register('headlessMissileCombat', JavaExec) {
  group = 'verification'
  description = 'Runs a generated Amazon Throw through D2GS missile sync and collision.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.riiablo.server.d2gs.D2GSHeadlessClient'
  workingDir = rootProject.file('assets').path
  args '--generated-amazon', '--skill', '2', '--require-missile'

  def d2Home = providers.environmentVariable('D2_HOME')
  if (d2Home.isPresent()) {
    args '--home', d2Home.get()
  }
}

tasks.register('headlessMultiplayer', JavaExec) {
  group = 'verification'
  description = 'Runs two windowless clients and verifies bidirectional player visibility.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.riiablo.server.d2gs.D2GSHeadlessClient'
  workingDir = rootProject.file('assets').path
  args '--generated-amazon', '--require-peer', '--require-monster-movement'

  def d2Home = providers.environmentVariable('D2_HOME')
  if (d2Home.isPresent()) {
    args '--home', d2Home.get()
  }
}

tasks.register('headlessFallenDual', JavaExec) {
  group = 'verification'
  description = 'Runs two real D2GS sockets through Fallen death, Shaman resurrection and peer loot pickup.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.riiablo.server.d2gs.D2GSHeadlessClient'
  workingDir = rootProject.file('assets').path
  args '--generated-amazon', '--require-fallen-scenario', '--attempts', '40'

  def d2Home = providers.environmentVariable('D2_HOME')
  if (d2Home.isPresent()) args '--home', d2Home.get()
}

jar {
  archiveBaseName = project.name
	// assets are present in both this project's resource set and the unpacked
	// :core runtime jar. Keep the first copy, matching the desktop fat-jar task.
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	// These can be excluded because they add to the jar size but libGDX 1.9.11 can't use them.
	// If your libGDX version is 1.9.10 or earlier, or is 1.9.12-SNAPSHOT or later, you can leave
	// the following line commented; if you use 1.9.11 exactly, or if you use 1.9.12-SNAPSHOT but
	// don't need ARM Linux support, you can uncomment it safely.
	// It's always safe to keep that line commented out; it only affects JAR size.
	// exclude('linux/arm32/**', 'linux/arm64/**')
	dependsOn configurations.runtimeClasspath
	from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
	manifest {
		attributes 'Main-Class': application.mainClass
	}

	doLast {
		file(archiveFile).setExecutable(true, false)
	}
}
